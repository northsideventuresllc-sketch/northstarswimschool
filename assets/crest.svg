<svg viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="North-Stars Swim School crest">
  <defs>
    <linearGradient id="cStarL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e21b2c"/><stop offset="1" stop-color="#c1121f"/></linearGradient>
    <linearGradient id="cStarR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d0208"/><stop offset="1" stop-color="#c1121f"/></linearGradient>
    <linearGradient id="cSplit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c3057"/><stop offset="0.5" stop-color="#1c3057"/>
      <stop offset="0.5" stop-color="#0e1b33"/><stop offset="1" stop-color="#0e1b33"/>
    </linearGradient>
  </defs>

  <!-- Shield: light rim, navy border, split-navy interior -->
  <path d="M200 12 L376 72 V232 C376 334 302 404 200 432 C98 404 24 334 24 232 V72 Z" fill="#e7eef7"/>
  <path d="M200 22 L368 80 V230 C368 326 300 392 200 418 C100 392 32 326 32 230 V80 Z" fill="#13223f"/>
  <path d="M200 34 L358 88 V228 C358 320 294 382 200 406 C106 382 42 320 42 228 V88 Z" fill="url(#cSplit)"/>
  <path d="M200 48 L342 102 V226 C342 306 286 362 200 384 C114 362 58 306 58 226 V102 Z" fill="none" stroke="#2a3f63" stroke-width="3"/>

  <!-- 3D star -->
  <g class="crest-star" style="transform-origin:200px 180px">
    <polygon points="200,92 224,164 200,146" fill="url(#cStarL)"/>
    <polygon points="200,92 176,164 200,146" fill="url(#cStarR)"/>
    <polygon points="200,146 176,164 108,164 164,202" fill="url(#cStarL)"/>
    <polygon points="200,146 224,164 292,164 236,202" fill="url(#cStarR)"/>
    <polygon points="164,202 145,270 200,226" fill="url(#cStarL)"/>
    <polygon points="236,202 255,270 200,226" fill="url(#cStarR)"/>
    <polygon points="164,202 200,226 200,146" fill="#e21b2c"/>
    <polygon points="236,202 200,226 200,146" fill="#a80f1a"/>
  </g>

  <!-- Splash flourish (right of star base) -->
  <g fill="#5bb3e0">
    <path d="M250 236 q26 -20 40 -2 q-14 4 -10 20 q-22 4 -30 -18 Z"/>
    <circle cx="300" cy="222" r="5"/><circle cx="292" cy="238" r="3.5"/><circle cx="278" cy="214" r="3"/>
  </g>

  <!-- Water band -->
  <path d="M60 250 q22 -16 44 0 t44 0 t44 0 t44 0 t44 0 v22 q-22 16 -44 0 t-44 0 t-44 0 t-44 0 t-44 0 Z" fill="#5bb3e0"/>
  <path d="M60 270 q22 -14 44 0 t44 0 t44 0 t44 0 t44 0 v16 q-22 14 -44 0 t-44 0 t-44 0 t-44 0 t-44 0 Z" fill="#2f7fb8"/>

  <!-- Ribbon banner with folded ends -->
  <path d="M30 312 L60 302 L58 352 L28 360 Z" fill="#0c1730"/>
  <path d="M370 312 L340 302 L342 352 L372 360 Z" fill="#0c1730"/>
  <path d="M52 300 Q200 286 348 300 L340 352 Q200 338 60 352 Z" fill="#f4f7fb" stroke="#13223f" stroke-width="6"/>
  <text x="200" y="332" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif"
        font-weight="800" font-size="21" letter-spacing="0.2" fill="#13223f"
        textLength="272" lengthAdjust="spacingAndGlyphs">NORTH-STARS SWIM SCHOOL</text>
</svg>
